# Meridian Claims — database / connection-pool configuration
# Override per environment via an external property file or -D system properties.

# ---- JDBC connection ----
jdbc.driverClassName=org.postgresql.Driver
jdbc.url=jdbc:postgresql://localhost:5432/meridian_claims
jdbc.username=meridian
jdbc.password=meridian

# ---- DBCP2 pool sizing ----
jdbc.pool.initialSize=5
jdbc.pool.maxTotal=20
jdbc.pool.maxIdle=10
jdbc.pool.minIdle=5
jdbc.pool.maxWaitMillis=10000

# Validate connections so a dead DB surfaces fast (supports fail-fast startup).
jdbc.pool.validationQuery=SELECT 1
jdbc.pool.testOnBorrow=true
jdbc.pool.testWhileIdle=true
jdbc.pool.timeBetweenEvictionRunsMillis=60000

# Reclaim connections leaked by stale transactions (30s abandoned threshold in dev).
# Production overrides this via the external conf/meridian-claims-prod.properties with a higher value.
jdbc.pool.removeAbandonedOnBorrow=true
jdbc.pool.removeAbandonedTimeout=30
jdbc.pool.logAbandoned=true
