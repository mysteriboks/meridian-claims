# Meridian Claims — Log4j 1.x configuration
# Daily rotation. DailyRollingFileAppender does not auto-prune old files;
# 30-day retention must be enforced externally via logrotate or equivalent
# (see docs/deployment-checklist.md).

log4j.rootLogger=INFO, CONSOLE, FILE

# Application packages log at DEBUG in non-production; tune via deployment overlay.
log4j.logger.com.meridian.claims=DEBUG

# Spring framework is noisy at DEBUG — keep at INFO.
log4j.logger.org.springframework=INFO
log4j.logger.org.flywaydb=INFO

# ---- Console appender ----
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n

# ---- Rolling file appender (daily, 30-day operational retention) ----
log4j.appender.FILE=org.apache.log4j.DailyRollingFileAppender
log4j.appender.FILE.File=${catalina.base}/logs/meridian-claims.log
log4j.appender.FILE.DatePattern='.'yyyy-MM-dd
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c - %m%n

# ---- SMTP appender (prod only) ----
# Activated in production (claims.mail.enabled=true via conf/meridian-claims-prod.properties).
# Configure SMTP host/port/credentials via environment or external properties;
# the appender is defined here so the class is on the classpath in all profiles,
# but it is only wired into the rootLogger appender list via log4j-prod.properties
# loaded at runtime under the prod profile (see StartupValidator / AppProfile).
#
# To enable manually for prod:  add SMTP to the rootLogger line and set the
# properties below via an external log4j overlay:
#
# log4j.appender.SMTP=org.apache.log4j.net.SMTPAppender
# log4j.appender.SMTP.SMTPHost=smtp.meridian.local
# log4j.appender.SMTP.SMTPPort=587
# log4j.appender.SMTP.From=noreply@meridian.local
# log4j.appender.SMTP.To=ops@meridian.local
# log4j.appender.SMTP.Subject=[Meridian Claims] ERROR alert
# log4j.appender.SMTP.Threshold=ERROR
# log4j.appender.SMTP.BufferSize=1
# log4j.appender.SMTP.layout=org.apache.log4j.PatternLayout
# log4j.appender.SMTP.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c - %m%n
