claims.auto.approve.threshold=500.00

# Batch claim intake (Phase 9 — FHIR R4 JSON; Phase 10 adds X12 EDI 837)
# Set claims.intake.enabled=true and configure the paths to activate.
claims.intake.enabled=false
claims.intake.path=
claims.intake.archive.path=
claims.intake.rejected.path=
claims.intake.system-user-id=0
claims.jobs.intake.cron=0 0/5 * * * ?

# Phase 10 — EDI file extension recognition (comma-separated, case-insensitive)
claims.intake.edi.extensions=edi,x12,837

# Phase 14 — X12 276 claim status inquiry file extension recognition (comma-separated,
# case-insensitive). Recognised by both pollers ahead of the claim-submission dispatch above —
# a 276 is a read-only query, routed to ClaimStatusInquiryService instead of ClaimService.submit.
claims.intake.status-inquiry.extensions=276

# Phase 15 — X12 278 prior-authorization request file extension recognition (comma-separated,
# case-insensitive). Also checked ahead of the claim-submission dispatch — a certified request
# creates a real prior_authorizations row via the existing PriorAuthorizationService.
claims.intake.prior-auth.extensions=278

# Phase 17 — X12 834 enrollment file extension recognition (comma-separated, case-insensitive).
# Also checked ahead of the claim-submission dispatch — an 834 add/change/termination record
# mutates members/member_coverage directly via the existing MemberService, with no response file.
claims.intake.enrollment.extensions=834

# Phase 11 — 835 remittance EDI output path (blank = download-only, no file written)
claims.remittance.edi.output.path=
# Phase 11 — ISA15 usage indicator: false=T (test), true=P (production).
# Must be set to true in the prod property overlay before connecting to a live clearinghouse.
claims.remittance.edi.production=false

# Phase 12 — EDI acknowledgment (TA1/999/277CA) output path (blank = generated in-memory
# and logged to edi_transactions.detail only, no file written).
claims.integration.edi.output.path=

# Phase 18 — EFT/ACH (NACHA) payment issuance. Meridian's own originating routing number,
# display name, and 10-char company identification — set these to real values in the prod
# overlay before an ODFI relationship goes live; the defaults below are structurally valid
# but non-routable test values, safe for dev.
claims.eft.origin.routing-number=123456789
claims.eft.origin.name=MERIDIAN CLAIMS
claims.eft.company.id=1234567890
# Phase 18 — NACHA ACH file output path (blank = generated in-memory and referenced from
# eft_payments only, no file written; same convention as claims.remittance.edi.output.path).
claims.eft.output.path=
# Phase 12 — ISA15 usage indicator for outbound acknowledgments: false=T (test), true=P
# (production). Same convention as claims.remittance.edi.production; set independently since
# acknowledgments and remittance can go to different endpoints.
claims.integration.edi.production=false

# Phase 19 — Reference-data & registry feeds. Each path is an independent inbound directory,
# one per feed type; blank = that feed is inert (never polled). A file dropped in any of these
# is staged (parsed + diffed) but never auto-applied — an Admin must explicitly approve each
# batch on the Reference Data Imports screen before it touches a live table.
claims.referencedata.diagnosis.path=
claims.referencedata.procedure.path=
claims.referencedata.carcrarc.path=
claims.referencedata.nppes.path=
claims.jobs.referencedata.cron=0 0 5 * * MON

# Phase 13 — trading-partner poller cadence. Polls every active trading_partners row via its
# configured transport (LOCAL directory or SFTP). Inert if no active partners are configured.
claims.jobs.trading-partner.cron=0 0/10 * * * ?
# Phase 13 — SFTP partner passwords are never stored in trading_partners; each partner's
# transport_credential_ref resolves to claims.transport.credential.<ref>, set only in the
# external prod property overlay (docs/meridian-claims-prod.properties.sample). No key is
# defined here in dev on purpose — SFTP partners are inert until configured in prod.

# Security policy — account lockout and password rules
claims.security.lockout.max-attempts=5
claims.security.lockout.minutes=30
claims.security.password.expiry-days=90
claims.security.password.min-length=8
claims.security.password.bcrypt-rounds=12

# UI pagination — rows per page
claims.ui.page-size.list=20
claims.ui.page-size.report=50

# SLA thresholds (hours per status; 0 = no SLA)
claims.sla.SUBMITTED.hours=24
claims.sla.IN_REVIEW.hours=48
claims.sla.PENDING_INFO.hours=72

# SLA escalation job cron (default: top of every hour)
claims.sla.escalation.cron=0 0 * * * ?

# Stale claim abandonment job (default: 2 AM nightly)
claims.jobs.stale.cron=0 0 2 * * ?

# Benefit-year rollover check (default: 3 AM nightly)
claims.jobs.rollover.cron=0 0 3 * * ?

# Appeal SLA thresholds
claims.appeal.internal.days=30
claims.appeal.external.days=3

# Appeal SLA escalation job (default: half past every hour)
claims.jobs.appeal.sla.cron=0 30 * * * ?

# Nightly slow-query report (default: 4 AM)
claims.jobs.slowquery.cron=0 0 4 * * ?
claims.slowquery.threshold.ms=500
claims.dba.email=dba@meridian.local

# Claim archive job (default: 1 AM nightly); claims older than N years are archived
claims.jobs.archive.cron=0 0 1 * * ?
claims.archive.retention.years=7

# Supervisor email for SLA escalation alerts (ADMIN role maps to supervisor)
claims.escalation.supervisor.email=admin@meridian.local

# Mail — set enabled=true and configure SMTP for production
claims.mail.enabled=false
claims.mail.from=noreply@meridian.local
claims.mail.smtp.host=localhost
claims.mail.smtp.port=25
claims.mail.smtp.username=
claims.mail.smtp.password=
